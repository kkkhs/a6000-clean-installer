name: Build community Windows installers

on:
  workflow_dispatch:
  push:
    branches: [main, build/community-windows]
    paths:
      - 'community/**'
      - 'payload/apps/**'
      - '.github/workflows/community-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r community/requirements-offline.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          New-Item -ItemType Directory -Force release-output | Out-Null
          python -m pip freeze | Set-Content -Encoding utf8 release-output/dependencies-windows.txt
      - name: Generate Windows WPD wrappers using the build environment
        run: |
          python -c "import comtypes.client; comtypes.client.GetModule('PortableDeviceApi.dll'); comtypes.client.GetModule('PortableDeviceTypes.dll'); import comtypes.gen.PortableDeviceApiLib; import comtypes.gen.PortableDeviceTypesLib"
          if ($LASTEXITCODE -ne 0) { throw 'WPD wrapper generation failed' }
      - name: Import and verify all 21 unchanged APKs
        run: |
          python -I community/tools/import_offline_apps.py payload/apps
          if ($LASTEXITCODE -ne 0) { throw 'APK import failed' }
          python -I community/tools/export_online_catalog.py --repo kkkhs/a6000-clean-installer --tag apk-set-v1
          if ($LASTEXITCODE -ne 0) { throw 'Online catalog generation failed' }
      - name: Run headless tests without a camera or network calls
        run: |
          python -I -m unittest discover -s community/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Mock tests failed' }
      - name: Build the offline and online executables
        working-directory: community
        run: |
          python -m PyInstaller --clean --noconfirm pmca-a6000-offline.spec
          if ($LASTEXITCODE -ne 0) { throw 'Offline build failed' }
          python -m PyInstaller --clean --noconfirm pmca-a6000-online.spec
          if ($LASTEXITCODE -ne 0) { throw 'Online build failed' }
      - name: Check frozen imports, metadata, APK bytes and Tcl/Tk startup
        working-directory: community
        run: |
          foreach ($mode in @('Offline', 'Online')) {
            $exe = (Resolve-Path "dist/A6000-PMCA-$mode-ZH.exe").Path
            $report = Join-Path $env:GITHUB_WORKSPACE "release-output/self-test-$mode.json"
            $proc = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -PassThru
            if (-not $proc.WaitForExit(180000)) {
              Stop-Process -Id $proc.Id -Force
              throw "$mode startup self-test timed out"
            }
            if (Test-Path $report) { Get-Content $report }
            if ($proc.ExitCode -ne 0 -or -not (Test-Path $report)) {
              throw "$mode startup self-test failed ($($proc.ExitCode))"
            }
            $result = Get-Content -Raw $report | ConvertFrom-Json
            if ($result.error -or $result.appCount -ne 21 -or -not $result.tkStartup) {
              throw "$mode self-test report did not pass"
            }
          }
      - name: Prepare checked release artifacts
        run: |
          Copy-Item community/dist/*.exe release-output/
          Copy-Item community/online-apps/catalog.json release-output/catalog.json
          Copy-Item community/README-A6000-ZH.md release-output/
          Copy-Item community/README-TWO-VERSIONS-ZH.md release-output/
          $sums = Get-ChildItem release-output/*.exe | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $sums | Set-Content -Encoding ascii release-output/SHA256SUMS.txt
      - name: Retain diagnostic reports even if startup checks fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a6000-build-diagnostics
          path: |
            release-output/*.json
            release-output/dependencies-windows.txt
            community/build/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain build outputs and validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a6000-community-windows
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
